name: Deploy TurnoSeve Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Construir Angular
        run: npx ng build --configuration production --base-href /turnoseve/

      - name: Preparar archivos para GitHub Pages
        run: |
          rm -rf site
          mkdir site

          if [ -d dist/turnoseve/browser ]; then
            cp -R dist/turnoseve/browser/. site/
          else
            cp -R dist/turnoseve/. site/
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
